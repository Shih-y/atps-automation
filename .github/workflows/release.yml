name: Windows desktop release

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: program
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            program/requirements.txt
            program/requirements-desktop.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-desktop.txt
      - name: Run isolated software tests
        run: python -m unittest discover -s tests -v
      - name: Optical analysis regression
        run: node --test tests/phase_analysis.test.js
      - name: Install browser test dependency
        run: npm install --no-save playwright@1.62.1
      - name: Interface and synthetic video regression
        run: |
          node tests/browser/experiment_console.js
          node tests/browser/current_console.js
          node tests/browser/integrated_console.js
          node tests/browser/experiment_live_frame.js
      - name: Build one-file desktop executable
        run: python build_windows.py
      - name: Packaged desktop smoke test
        run: node tests/browser/desktop_smoke.js
      - name: Stage release files
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG_NAME -replace '[^0-9A-Za-z._-]', '-'
          $asset = "ATPS-Automation-$tag.exe"
          Copy-Item 'dist/ATPS-Automation.exe' $asset
          Copy-Item 'dist/ATPS-Automation.exe.config' "$asset.config"
          $bundle = "ATPS-Automation-$tag-windows.zip"
          Compress-Archive -Path 'dist/ATPS-Automation.exe','dist/ATPS-Automation.exe.config','build_info.json','../docs/五瓶自动实验操作说明.txt','../docs/2026-11-14_修复与验收说明.txt' -DestinationPath $bundle
          @($asset,"$asset.config",$bundle,'build_info.json') | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant())  $_" } | Set-Content -Encoding ascii SHA256SUMS.txt
          "Source commit: $env:GITHUB_SHA`nWindows tests, optical regression, browser and desktop smoke checks completed.`nHardware dosing and phase accuracy require experimental validation." | Set-Content -Encoding utf8 RELEASE_NOTES.txt
          "RELEASE_ASSET=$asset" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "RELEASE_BUNDLE=$bundle" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$env:TAG_NAME" "$env:RELEASE_ASSET" "$env:RELEASE_ASSET.config" "$env:RELEASE_BUNDLE" SHA256SUMS.txt build_info.json --title "$env:TAG_NAME" --notes-file RELEASE_NOTES.txt
