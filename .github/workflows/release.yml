name: Windows desktop release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: program
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            program/requirements.txt
            program/requirements-desktop.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-desktop.txt
      - name: Run isolated software tests
        run: python -m unittest discover -s tests -v
      - name: Build one-file desktop executable
        run: python build_windows.py
      - name: Stage release files
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG_NAME -replace '[^0-9A-Za-z._-]', '-'
          $asset = "ATPS-Automation-$tag.exe"
          Copy-Item 'dist/ATPS-Automation.exe' $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Encoding ascii SHA256SUMS.txt
          "RELEASE_ASSET=$asset" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$env:TAG_NAME" "$env:RELEASE_ASSET" SHA256SUMS.txt --title "$env:TAG_NAME" --generate-notes --notes "Windows 10/11 x64 单文件桌面版。数据目录：%LOCALAPPDATA%\ATPS-Automation\data。使用相机前，请在 Windows 设置 → 隐私和安全性 → 相机中允许相机及桌面应用访问。"
