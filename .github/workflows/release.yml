name: Windows desktop release

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: program
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            program/requirements.txt
            program/requirements-desktop.txt
      - name: Extract release notes from changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: python ../.github/scripts/release_notes.py --changelog ../CHANGELOG.md --tag "$env:TAG_NAME" --output "$env:RUNNER_TEMP/RELEASE_NOTES.md"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-desktop.txt
      - name: Run isolated software tests
        run: python -m unittest discover -s tests -v
      - name: Optical analysis regression
        run: node --test tests/phase_analysis.test.js
      - name: Install browser test dependency
        run: npm install --no-save playwright@1.62.1
      - name: Interface and synthetic video regression
        run: |
          foreach ($testScript in @('experiment_console.js','continuation_console.js','current_console.js','integrated_console.js','experiment_live_frame.js','continuation_live_frame.js','autonomous_console.js','autonomous_live_frame.js','source_volume_console.js')) {
            node "tests/browser/$testScript"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build one-file desktop executable
        run: python build_windows.py
      - name: Build desktop directory for the Windows ZIP
        run: python build_windows.py --onedir
      - name: Stage release files
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG_NAME -replace '[^0-9A-Za-z._-]', '-'
          $asset = "ATPS-Automation-$tag.exe"
          Copy-Item 'dist/ATPS-Automation.exe' $asset
          Copy-Item 'dist/ATPS-Automation.exe.config' "$asset.config"
          $bundle = "ATPS-Automation-$tag-windows.zip"
          Compress-Archive -Path 'dist/ATPS-Automation/*','build_info.json','../docs/五瓶自动实验操作说明.txt','../docs/2026-11-14_修复与验收说明.txt','../docs/同瓶补加与自动研究操作说明.txt','../docs/母液浓度与密度核查.txt','../docs/2026-11-15_自动配方与观察闭环说明.txt','../docs/2026-11-15_分来源体积标定与修复说明.txt' -DestinationPath $bundle
          @($asset,"$asset.config",$bundle,'build_info.json') | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant())  $_" } | Set-Content -Encoding ascii SHA256SUMS.txt
          "RELEASE_ASSET=$asset" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "RELEASE_BUNDLE=$bundle" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Packaged desktop smoke tests (basic)
        shell: pwsh
        run: |
          $env:ATPS_EXE = Join-Path $PWD $env:RELEASE_ASSET
          node tests/browser/desktop_smoke.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expanded = Join-Path $env:RUNNER_TEMP 'atps-release-check'
          python -m zipfile -e "$env:RELEASE_BUNDLE" "$expanded"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ATPS_EXE = Join-Path $expanded 'ATPS-Automation.exe'
          node tests/browser/desktop_smoke.js
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$env:TAG_NAME" "$env:RELEASE_ASSET" "$env:RELEASE_ASSET.config" "$env:RELEASE_BUNDLE" SHA256SUMS.txt build_info.json --title "$env:TAG_NAME" --notes-file "$env:RUNNER_TEMP/RELEASE_NOTES.md"
