name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: program
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install -r requirements.txt
      - name: Run isolated software tests
        run: python -m unittest discover -s tests -v
      - name: Run optical analysis tests on synthetic images
        run: node --test tests/phase_analysis.test.js
