name: Windows desktop interactions (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-interactions:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: program
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            program/requirements.txt
            program/requirements-desktop.txt
      - name: Install desktop dependencies
        run: python -m pip install -r requirements.txt -r requirements-desktop.txt
      - name: Install browser test dependency
        run: npm install --no-save playwright@1.62.1
      - name: Build one-file desktop executable
        run: python build_windows.py
      - name: Prepare display for native desktop test
        shell: powershell
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Packaged desktop smoke test with native interactions
        run: node tests/browser/desktop_smoke.js --native-interactions
